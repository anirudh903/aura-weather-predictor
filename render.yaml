# Render Blueprint — lets Render set the whole service up automatically.
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aura-weather-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
